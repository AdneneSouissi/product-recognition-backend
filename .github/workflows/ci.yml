name: backend-ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

jobs:
  api_fast_health_checks:
    name: Fast Health Checks Without Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Sanity Import And Byte Compile
        run: |
          python - << 'PY'
          import sys
          import fastapi, uvicorn, prometheus_client
          print('imports ok')
          PY
          python -m compileall .
      - name: Start API Without Model
        env:
          SKIP_MODEL_LOAD: '1'
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          sleep 1
          pgrep -fa uvicorn || true
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then echo 'API up'; break; fi
            sleep 1
          done
      - name: Verify Endpoints
        run: |
          # final retry gate before assertions
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -f http://127.0.0.1:8000/version
          # readiness should be 503 without model
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz)
          echo "readyz status: $code"; test "$code" = "503"
          curl -f http://127.0.0.1:8000/metrics | head -n 20
      - name: Run Pytest Health Tests
        run: |
          pytest -q tests/test_api_health.py
      - name: Diagnostics On Failure
        if: failure()
        run: |
          echo '--- api.log (last 200 lines) ---'
          tail -n 200 api.log || true
          echo '--- listening sockets ---'
          ss -ltnp || true
          echo '--- uvicorn processes ---'
          pgrep -fa uvicorn || true

  api_predict_smoke_with_model:
    name: Predict Smoke With Model
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Model Artifact Presence
        id: model
        run: |
          if [ -f yolov8n.pt ]; then echo "has_model=true" >> $GITHUB_OUTPUT; else echo "has_model=false" >> $GITHUB_OUTPUT; fi
      - name: Start API With Model
        if: steps.model.outputs.has_model == 'true'
        env:
          SKIP_MODEL_LOAD: '0'
          MODEL_URI: 'yolov8n.pt'
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          sleep 2
          pgrep -fa uvicorn || true
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz || echo "000")
            if [ "$code" = "200" ]; then echo 'API ready'; break; fi
            sleep 2
          done
          curl -f http://127.0.0.1:8000/readyz
      - name: Diagnostics On Failure
        if: failure()
        run: |
          echo '--- api.log (last 200 lines) ---'
          tail -n 200 api.log || true
          echo '--- listening sockets ---'
          ss -ltnp || true
          echo '--- uvicorn processes ---'
          pgrep -fa uvicorn || true
      - name: Predict Tiny Image
        if: steps.model.outputs.has_model == 'true'
        run: |
          python - << 'PY'
          import io, requests
          from PIL import Image
          img = Image.new('RGB', (1,1), color='white')
          buf = io.BytesIO(); img.save(buf, format='JPEG'); buf.seek(0)
          files = {'file': ('tiny.jpg', buf, 'image/jpeg')}
          r = requests.post('http://127.0.0.1:8000/predict', files=files)
          print('status', r.status_code)
          print(r.text)
          assert r.status_code == 200
          PY
      - name: Skip Predict When Model Missing
        if: steps.model.outputs.has_model != 'true'
        run: echo "Model yolov8n.pt not found; skipping scheduled predict smoke."

  monitoring_stack_smoke:
    name: Monitoring Stack Smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product-recognition-backend
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
      - name: Compose Up API Prometheus Grafana
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          docker ps
      - name: Wait For API And Prometheus
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then echo 'API up'; break; fi; sleep 1; done
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9090/-/ready > /dev/null; then echo 'Prometheus ready'; break; fi; sleep 1; done
      - name: Generate Some Traffic
        run: |
          for i in $(seq 1 5); do curl -fsS http://127.0.0.1:8000/healthz > /dev/null; sleep 1; done
          curl -fsS http://127.0.0.1:8000/version > /dev/null
      - name: Verify Prometheus Target Up
        run: |
          curl -fsS "http://127.0.0.1:9090/api/v1/targets" | jq '.data.activeTargets[] | select(.labels.job=="api") | .health' | grep -E 'healthy' -q
      - name: Query Requests Metric
        run: |
          # It might be zero if too soon; we accept a valid response
          curl -fsS "http://127.0.0.1:9090/api/v1/query?query=sum(rate(requests_total[1m]))" | jq -e '.status == "success"' > /dev/null
      - name: Validate Prometheus Rules If Promtool Available
        run: |
          if command -v promtool >/dev/null 2>&1; then promtool check rules monitoring/alerts.yml; else echo 'promtool not available, skipping'; fi
      - name: Verify Grafana Login Page
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login)
          echo "grafana login status: $code"; [[ "$code" == 2* || "$code" == 3* ]] || exit 1
      - name: Upload Monitoring Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-configs
          path: |
            monitoring/prometheus.yml
            monitoring/alerts.yml
            monitoring/grafana-dashboard.json
      - name: Compose Logs On Failure
        if: failure()
        run: |
          docker compose logs --no-color api prometheus grafana | tail -n 400 || true
      - name: Compose Down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
