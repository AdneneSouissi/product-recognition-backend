name: backend-ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

jobs:
  fast-health-checks:
    name: Fast checks (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sanity import & compile
        run: |
          python - << 'PY'
          import sys
          import fastapi, uvicorn, prometheus_client
          print('imports ok')
          PY
          python -m compileall .
      - name: Boot API (no model)
        env:
          SKIP_MODEL_LOAD: '1'
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/healthz > /dev/null; then echo 'API up'; break; fi
            sleep 1
          done
      - name: Endpoint checks
        run: |
          curl -f http://127.0.0.1:8000/healthz
          curl -f http://127.0.0.1:8000/version
          # readiness should be 503 without model
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz)
          echo "readyz status: $code"; test "$code" = "503"
          curl -f http://127.0.0.1:8000/metrics | head -n 20

  predict-smoke:
    name: Predict smoke (with model)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies (may pull torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check model artifact presence
        id: model
        run: |
          if [ -f yolov8n.pt ]; then echo "has_model=true" >> $GITHUB_OUTPUT; else echo "has_model=false" >> $GITHUB_OUTPUT; fi
      - name: Boot API (with model)
        if: steps.model.outputs.has_model == 'true'
        env:
          SKIP_MODEL_LOAD: '0'
          MODEL_URI: 'yolov8n.pt'
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/readyz)
            if [ "$code" = "200" ]; then echo 'API ready'; break; fi
            sleep 2
          done
          curl -f http://127.0.0.1:8000/readyz
      - name: Predict a tiny image
        if: steps.model.outputs.has_model == 'true'
        run: |
          python - << 'PY'
          import io, requests
          from PIL import Image
          img = Image.new('RGB', (1,1), color='white')
          buf = io.BytesIO(); img.save(buf, format='JPEG'); buf.seek(0)
          files = {'file': ('tiny.jpg', buf, 'image/jpeg')}
          r = requests.post('http://127.0.0.1:8000/predict', files=files)
          print('status', r.status_code)
          print(r.text)
          assert r.status_code == 200
          PY
      - name: Skip predict (model not present)
        if: steps.model.outputs.has_model != 'true'
        run: echo "Model yolov8n.pt not found; skipping scheduled predict smoke."
